global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: puq-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:9102"]

  # Các target này yêu cầu profile linux-monitoring trên host Linux.
  - job_name: node
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8080"]

  # Chỉ scrape khi profile nvidia-monitoring đang chạy trên Linux NVIDIA.
  - job_name: dcgm
    metrics_path: /metrics
    static_configs:
      - targets: ["dcgm-exporter:9400"]
