      - uid: puq-linux-host-memory-high
        title: RAM host Linux cao
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: puq-prometheus
            model:
              editorMode: code
              expr: max(100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))
              format: time_series
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: ["A", "5m", "now"]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        annotations:
          summary: RAM Linux host vượt 90%
          description: Số liệu chỉ có khi node_exporter Linux được bật.
        labels:
          severity: warning

      - uid: puq-windows-host-memory-high
        title: RAM host Windows cao
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: puq-prometheus
            model:
              editorMode: code
              expr: max(100 * windows_memory_committed_bytes / windows_memory_commit_limit)
              format: time_series
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: ["A", "5m", "now"]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        annotations:
          summary: RAM Windows host vượt 90%
          description: Dùng commit/limit từ windows_exporter native; không phải container Windows.
        labels:
          severity: warning

      - uid: puq-linux-container-memory-high
        title: RAM container Linux cao
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: puq-prometheus
            model:
              editorMode: code
              expr: 100 * sum(container_memory_working_set_bytes{image!=""}) / clamp_min(sum(container_spec_memory_limit_bytes{image!=""} > 0), 1)
              format: time_series
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: ["A", "5m", "now"]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        annotations:
          summary: RAM container Linux vượt 90%
          description: Cần cAdvisor và giới hạn memory của container để diễn giải chính xác.
        labels:
          severity: warning

      - uid: puq-dcgm-xid-errors
        title: Phát hiện lỗi XID GPU NVIDIA
        condition: B
        for: 1m
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: puq-prometheus
            model:
              editorMode: code
              expr: max(DCGM_FI_DEV_XID_ERRORS)
              format: time_series
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: ["A", "5m", "now"]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        annotations:
          summary: DCGM báo XID error
          description: DCGM_FI_DEV_XID_ERRORS là mã lỗi XID gần nhất; chỉ áp dụng khi DCGM exporter có dữ liệu.
        labels:
          severity: critical
