# Overlay giám sát: được Compose tự động ghép (docker-compose.override.yaml).
# KHÔNG cần -f -f: chỉ cần đặt COMPOSE_PROFILES trong .env, ví dụ COMPOSE_PROFILES=cpu,frontend,monitoring
#   docker compose up -d --build        # toàn bộ stack + giám sát
#   docker compose down                 # dừng tất cả
# Linux host: đặt PUQ_PROMETHEUS_CONFIG=prometheus-linux.yml và thêm profile linux-monitoring vào COMPOSE_PROFILES.
# Linux NVIDIA: PUQ_PROMETHEUS_CONFIG=prometheus-linux-gpu.yml, thêm profile nvidia-monitoring.
# Windows: windows_exporter chạy native trên host (đã cấu hình sẵn target host.docker.internal:9182).
services:
  api-cpu:
    environment:
      PUQ_METRICS_ENABLED: "true"
      PUQ_METRICS_BIND_HOST: "0.0.0.0"
      PUQ_METRICS_PORT: "9102"

  api-gpu:
    build:
      target: prod-gpu
    environment:
      PUQ_METRICS_ENABLED: "true"
      PUQ_METRICS_BIND_HOST: "0.0.0.0"
      PUQ_METRICS_PORT: "9102"

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./deploy/observability/${PUQ_PROMETHEUS_CONFIG:-prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the environment}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: ["linux-monitoring"]
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)(/|$)
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    profiles: ["linux-monitoring"]
    command:
      - --docker_only=true
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped

  dcgm-exporter:
    # Chỉ chạy trên Linux có NVIDIA driver + NVIDIA Container Toolkit tương thích.
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.6.1-4.8.4
    profiles: ["nvidia-monitoring"]
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
